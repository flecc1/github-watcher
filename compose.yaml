services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: github_watcher

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/scheme.sql:/docker-entrypoint-initdb.d/001-scheme.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: